<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#171614">
  <title>Headliner</title>
  <link rel="stylesheet" href="app.css?v=persistent-poster-1">
</head>
<body>
  <main class="shell">
    <header id="masthead" class="masthead">
      <h1>HEADLINER</h1>
      <p>You are on the poster.<br>You are tiny.<br>Get bigger.</p>
    </header>
    <section id="setup" class="paper setup">
      <div class="kicker">YOU HAVE A BAND</div>
      <label for="band-name">Unfortunately, what are they called?</label>
      <input id="band-name" maxlength="24" value="SUPERMODEL" autocomplete="off">
      <button id="start-btn" class="big-button">FIND YOUR NAME →</button>
    </section>
    <section id="game" class="hidden game-screen">
      <header class="game-header">
        <div class="game-identity">
          <div class="game-band" id="band-title">SUPERMODEL</div>
          <div class="game-rank">#<span id="rank">68</span></div>
          <div class="game-turn">WK <span id="turn">1</span>/12</div>
        </div>
        <button id="reset-btn" class="reset-button" aria-label="Start over">↻</button>
      </header>
      <section class="mini-stats">
        <div><small>CASH</small><strong>£<span id="cash">120</span></strong></div>
        <div><small>CHAOS</small><strong id="chaos">12</strong></div>
      </section>
      <section id="event-card" class="event-card"></section>
    </section>
  </main>
  <script src="app.js?v=persistent-poster-1"></script>
</body>
</html>
