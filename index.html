<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#ef4d3f">
  <title>Band Manager</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main class="shell">
    <header id="masthead" class="masthead">
      <div class="issue">A VERY SMALL MUSIC BUSINESS DISASTER</div>
      <h1>BAND<br>MANAGER</h1>
      <p>Get your band up the bill without destroying them.</p>
    </header>

    <section id="setup" class="paper setup">
      <div class="kicker">YOU HAVE A BAND</div>
      <label for="band-name">Unfortunately, what are they called?</label>
      <input id="band-name" maxlength="24" value="SUPERMODEL" autocomplete="off">
      <button id="start-btn" class="big-button">SEE THE FESTIVAL BILL →</button>
    </section>

    <section id="game" class="hidden game-screen">
      <header class="game-header">
        <div class="game-band"><span id="band-title">SUPERMODEL</span><small> · <span id="turn">1</span>/18</small></div>
        <button id="reset-btn" class="reset-button" aria-label="Start over">↻</button>
      </header>
      <section class="mini-stats">
        <div><small>CASH</small><strong>£<span id="cash">120</span></strong></div>
        <div><small>REP</small><strong id="rep">2</strong></div>
        <div><small>CHAOS</small><strong id="chaos">12</strong></div>
      </section>
      <section id="event-card" class="event-card"></section>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
