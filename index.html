<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5e8c8">
  <title>Band Manager</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div class="issue">EST. FIVE MINUTES AGO</div>
      <h1>BAND<br>MANAGER</h1>
      <p>Keep four musicians together long enough to become famous.</p>
    </header>

    <section id="setup" class="paper setup">
      <div class="kicker">FORM A BAND</div>
      <label for="band-name">What are these idiots called?</label>
      <input id="band-name" maxlength="24" value="SUPERMODEL" autocomplete="off">
      <button id="start-btn" class="big-button">START THE BAND →</button>
      <p class="fineprint">No musical ability required. Apparently.</p>
    </section>

    <section id="game" class="hidden">
      <section class="band-card paper">
        <div class="band-heading">
          <div>
            <div class="kicker">CURRENTLY STILL TOGETHER</div>
            <h2 id="band-title">SUPERMODEL</h2>
          </div>
          <div class="turn-stamp">WEEK <span id="week">1</span></div>
        </div>

        <div class="stats">
          <div><span>£</span><strong id="cash">120</strong><small>CASH</small></div>
          <div><strong id="fans">18</strong><small>FANS</small></div>
          <div><strong id="rep">2</strong><small>REP</small></div>
          <div><strong id="chaos">12</strong><small>CHAOS</small></div>
        </div>

        <div class="roster" id="roster"></div>
      </section>

      <section id="event-card" class="paper event-card"></section>

      <section class="footer-strip">
        <span>GOAL: 1,000 FANS</span>
        <button id="reset-btn" class="text-button">START OVER</button>
      </section>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
