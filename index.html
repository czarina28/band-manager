<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#171614">
  <title>Headliner</title>
  <link rel="stylesheet" href="app.css?v=persistent-poster-1">
</head>
<body>
  <main class="shell">
    <header id="masthead" class="masthead"><h1>HEADLINER</h1><p>You are on the poster.<br>You are tiny.<br>Get bigger.</p></header>
    <section id="setup" class="paper setup"><div class="kicker">YOU HAVE A BAND</div><label for="band-name">Unfortunately, what are they called?</label><input id="band-name" maxlength="24" value="SUPERMODEL" autocomplete="off"><button id="start-btn" class="big-button">FIND YOUR NAME →</button></section>
    <section id="game" class="hidden game-screen">
      <header class="game-header"><div class="game-identity"><div class="game-band" id="band-title">SUPERMODEL</div><div class="game-rank">#<span id="rank">68</span></div><div class="game-turn">WK <span id="turn">1</span>/12</div></div><button id="reset-btn" class="reset-button" aria-label="Start over">↻</button></header>
      <section class="mini-stats"><div><small>CASH</small><strong>£<span id="cash">120</span></strong></div><div><small>CHAOS</small><strong id="chaos">12</strong></div></section>
      <section id="event-card" class="event-card"></section>
    </section>
  </main>
  <script src="app.js?v=persistent-poster-2"></script>
  <script>
  (()=>{
    function overlay(html){document.querySelector('.game-overlay')?.remove();const d=document.createElement('div');d.className='game-overlay';d.innerHTML=html;$('event-card').appendChild(d);return d}
    function flash(text){const d=document.createElement('div');d.className='result-flash';d.textContent=text;$('event-card').appendChild(d);setTimeout(()=>d.remove(),1150)}
    showRivalWeek=function(){const rival=rivalAbove();if(!rival)return showOpportunities();state.lastRival=rival;const d=overlay(`<div class="crisis"><div class="event-label">THE BAND DIRECTLY ABOVE YOU · #${state.rank-1}</div><div class="event-title">${rival}</div><p class="event-copy">${rivalStory(rival)}<br><br><strong>They are between you and bigger type.</strong></p><div class="choices"><button class="choice" data-rival="outplay">OUTPLAY THEM<br><small>Risky · bigger jump</small></button><button class="choice" data-rival="use">USE THEM<br><small>Share their crowd</small></button><button class="choice" data-rival="ignore">IGNORE THEM<br><small>Build your own band</small></button></div></div>`);d.querySelectorAll('[data-rival]').forEach(b=>b.onclick=()=>resolveRivalChoice(b.dataset.rival))}
    resolveRivalChoice=function(choice){const rival=state.lastRival;state.rivalHeat[rival]=(state.rivalHeat[rival]||0)+1;if(choice==='ignore')return showOpportunities();const old=state.rank;let move=0,chaos=0;if(choice==='outplay'){const win=Math.random()>(.34+state.chaos/250);if(win){move=2+Math.floor(Math.random()*4);chaos=5}else{move=-1-Math.floor(Math.random()*3);chaos=8}}else{move=1+Math.floor(Math.random()*3);chaos=2}state.rank-=move;state.chaos+=chaos;state.week++;state.offerIds=[];clamp();const actual=old-state.rank;save();showPoster(actual>0?`${state.name} MOVES UP. ${rival} WILL REMEMBER THAT.`:`${rival} WINS THIS WEEK.`);flash(actual>0?`YOU BEAT ${rival}`:`${rival} BEAT YOU`)}
    showOpportunities=function(){let offers=currentOffers();if(!offers.length)offers=drawOffers();const d=overlay(`<div class="opportunity-screen"><div class="event-label">${TOTAL_WEEKS-state.week+1} WEEKS TO MEGA</div><div class="event-title">BUILD THE BAND.</div><div class="opportunity-list">${offers.map(o=>`<button class="opportunity" data-id="${o.id}"><strong>${o.title}</strong><small>${o.meta}</small><span>${o.copy}</span></button>`).join('')}</div></div>`);d.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>chooseOpportunity(b.dataset.id))}
    chooseOpportunity=function(id){const o=opportunities.find(x=>x.id===id);if(!o||o.cost>state.cash)return;state.cash-=o.cost;state.offerIds=[];state.active={...o};renderStats();const p=o.problem;const d=overlay(`<div class="crisis"><div class="event-label">${o.title}</div><div class="event-title">${p[0]}</div><p class="event-copy">${p[1]}</p><div class="choices"><button class="choice" data-fix="0">${p[2]}</button><button class="choice" data-fix="1">${p[3]}</button></div></div>`);d.querySelectorAll('[data-fix]').forEach(b=>b.onclick=()=>resolveOpportunity(+b.dataset.fix))}
    resolveOpportunity=function(choice){const a=state.active,old=state.rank;let move=a.base,chaosChange=0;const gamble=choice===0,danger=Math.max(.08,Math.min(.75,.15+state.chaos/120+a.risk/30));if(gamble){if(Math.random()>danger){move+=3+Math.floor(Math.random()*4);chaosChange=3+Math.max(0,a.risk)}else{move=-(2+Math.floor(Math.random()*5));chaosChange=5+Math.max(0,a.risk)}}else{move=Math.max(0,move-2);chaosChange=Math.min(2,a.risk)}if(a.id==='rehearse'){chaosChange=gamble?2:-7;move=gamble?2:1}state.rank-=move;state.chaos+=chaosChange;state.week+=a.weeks;state.active=null;clamp();const actual=old-state.rank;save();showPoster(actual>0?`${state.name} JUST PASSED ${actual} ACT${actual===1?'':'S'}.`:actual<0?`${state.name} DROPS DOWN THE BILL.`:'THE BILL IS UNCHANGED.');flash(actual>0?`UP ${actual} PLACE${actual===1?'':'S'}`:actual<0?`DOWN ${Math.abs(actual)} PLACE${actual===-1?'':'S'}`:'BILLING UNCHANGED')}
  })();
  </script>
</body>
</html>
